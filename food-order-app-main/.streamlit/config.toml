[theme]
# TimNoi Shabu brand theme — classic red & white, the color pairing most
# associated with restaurants/food brands worldwide (still keeps the warm
# gold/brown logo as an accent within the red, not as the base palette).
# Edit these tokens (not CSS) to re-skin the app; see the Streamlit theming
# docs: https://docs.streamlit.io/develop/concepts/configuration/theming
base = "light"
primaryColor = "#C1272D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAF3F3"
textColor = "#241414"
borderColor = "#EDD9D9"
linkColor = "#8E1F1F"
linkUnderline = false

greenColor = "#2E7D32"
greenBackgroundColor = "#E8F5E9"
greenTextColor = "#1B5E20"
redColor = "#C62828"
redBackgroundColor = "#FDECEA"
redTextColor = "#8E1F1F"
orangeColor = "#E65100"
orangeBackgroundColor = "#FFF3E0"
orangeTextColor = "#A34600"
blueColor = "#1565C0"
grayColor = "#8A7373"

baseRadius = "large"
buttonRadius = "large"
showWidgetBorder = true
dataframeBorderColor = "#EDD9D9"
dataframeHeaderBackgroundColor = "#FAF3F3"

font = "Sarabun:https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
headingFont = "Sarabun:https://fonts.googleapis.com/css2?family=Sarabun:wght@600;700&display=swap"
baseFontSize = 16
baseFontWeight = 400
headingFontWeights = [700, 700, 600, 600, 600, 600]

[client]
# Hide the dev-only toolbar (Deploy button etc.) for a clean, app-like feel
# in front of customers. Only options explicitly set below would still show.
toolbarMode = "minimal"
# Never leak Python stack traces / file paths to restaurant customers.
showErrorDetails = "none"

[server]
maxUploadSize = 8
